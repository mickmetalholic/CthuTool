apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: observability-kube-prometheus-stack
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 87.2.1
    helm:
      releaseName: kube-prometheus-stack
      values: |
        fullnameOverride: kube-prometheus-stack

        additionalPrometheusRulesMap:
          cthutool-backend:
            groups:
              - name: cthutool-backend.rules
                rules:
                  - alert: CthuToolBackendTargetDown
                    expr: up{namespace="cthutool",service="cthutool-backend"} == 0
                    for: 5m
                    labels:
                      severity: critical
                      app: cthutool
                      component: backend
                    annotations:
                      summary: CthuTool backend Prometheus target is down
                      description: Prometheus has not been able to scrape the CthuTool backend target for 5 minutes.
                  - alert: CthuToolBackendReadinessDegraded
                    expr: max(cthutool_backend_readiness_status{status="degraded"}) == 1
                    for: 5m
                    labels:
                      severity: warning
                      app: cthutool
                      component: backend
                    annotations:
                      summary: CthuTool backend readiness is degraded
                      description: The backend readiness endpoint reports at least one degraded dependency.
                  - alert: CthuToolBackendHighErrorRate
                    expr: |
                      (
                        sum(rate(cthutool_backend_http_requests_total{outcome="error"}[5m]))
                        /
                        clamp_min(sum(rate(cthutool_backend_http_requests_total[5m])), 1)
                      ) > 0.05
                    for: 10m
                    labels:
                      severity: warning
                      app: cthutool
                      component: backend
                    annotations:
                      summary: CthuTool backend HTTP error rate is high
                      description: More than 5% of backend HTTP requests have failed over the last 10 minutes.
                  - alert: CthuToolBackendHighP95Latency
                    expr: |
                      histogram_quantile(
                        0.95,
                        sum by (le) (rate(cthutool_backend_http_request_duration_seconds_bucket[5m]))
                      ) > 2
                    for: 10m
                    labels:
                      severity: warning
                      app: cthutool
                      component: backend
                    annotations:
                      summary: CthuTool backend p95 latency is high
                      description: Backend HTTP request p95 latency has exceeded 2 seconds for 10 minutes.
                  - alert: CthuToolBrowserTaskTimeouts
                    expr: sum(rate(cthutool_backend_browser_task_total{outcome="timeout"}[5m])) > 0
                    for: 10m
                    labels:
                      severity: warning
                      app: cthutool
                      component: browser
                    annotations:
                      summary: CthuTool browser tasks are timing out
                      description: Browser task timeout activity has been observed for 10 minutes.
                  - alert: CthuToolAgentCommandFailures
                    expr: sum(rate(cthutool_backend_agent_command_total{outcome=~"timeout|unavailable"}[5m])) > 0
                    for: 10m
                    labels:
                      severity: warning
                      app: cthutool
                      component: agent
                    annotations:
                      summary: CthuTool desktop agent commands are failing
                      description: Agent command timeout or unavailable outcomes have been observed for 10 minutes.

        alertmanager:
          enabled: true
          service:
            type: ClusterIP

        grafana:
          enabled: true
          service:
            type: ClusterIP
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard
            datasources:
              enabled: true
              defaultDatasourceEnabled: true
              uid: prometheus
          additionalDataSources:
            - name: Loki
              uid: loki
              type: loki
              access: proxy
              url: http://loki-gateway.observability.svc.cluster.local
              isDefault: false
            - name: Tempo
              uid: tempo
              type: tempo
              access: proxy
              url: http://tempo.observability.svc.cluster.local:3100
              isDefault: false
              jsonData:
                tracesToLogsV2:
                  datasourceUid: loki
                  filterByTraceID: true
                  spanStartTimeShift: "-1h"
                  spanEndTimeShift: "1h"
                serviceMap:
                  datasourceUid: prometheus
          dashboards:
            default:
              cthutool-workloads:
                json: |
                  {
                    "annotations": {
                      "list": []
                    },
                    "editable": true,
                    "fiscalYearStartMonth": 0,
                    "graphTooltip": 0,
                    "id": null,
                    "links": [
                      {
                        "targetBlank": false,
                        "title": "CthuTool backend logs",
                        "type": "link",
                        "url": "/explore?left={\"datasource\":\"loki\",\"queries\":[{\"expr\":\"{namespace=\\\"cthutool\\\",app=\\\"cthutool\\\",component=\\\"backend\\\"}\"}],\"range\":{\"from\":\"now-1h\",\"to\":\"now\"}}"
                      }
                    ],
                    "panels": [
                      {
                        "datasource": {
                          "type": "prometheus",
                          "uid": "prometheus"
                        },
                        "fieldConfig": {
                          "defaults": {
                            "color": {
                              "mode": "thresholds"
                            },
                            "thresholds": {
                              "mode": "absolute",
                              "steps": [
                                {
                                  "color": "red",
                                  "value": null
                                },
                                {
                                  "color": "green",
                                  "value": 1
                                }
                              ]
                            }
                          },
                          "overrides": []
                        },
                        "gridPos": {
                          "h": 8,
                          "w": 8,
                          "x": 0,
                          "y": 0
                        },
                        "id": 1,
                        "options": {
                          "colorMode": "value",
                          "graphMode": "area",
                          "justifyMode": "auto",
                          "orientation": "auto",
                          "reduceOptions": {
                            "calcs": [
                              "lastNotNull"
                            ],
                            "fields": "",
                            "values": false
                          },
                          "showPercentChange": false,
                          "textMode": "auto",
                          "wideLayout": true
                        },
                        "pluginVersion": "12.2.1",
                        "targets": [
                          {
                            "datasource": {
                              "type": "prometheus",
                              "uid": "prometheus"
                            },
                            "editorMode": "code",
                            "expr": "sum(up{namespace=\"cthutool\",service=\"cthutool-backend\"})",
                            "instant": true,
                            "legendFormat": "backend targets up",
                            "range": false,
                            "refId": "A"
                          }
                        ],
                        "title": "Backend scrape targets up",
                        "type": "stat"
                      },
                      {
                        "datasource": {
                          "type": "prometheus",
                          "uid": "prometheus"
                        },
                        "fieldConfig": {
                          "defaults": {},
                          "overrides": []
                        },
                        "gridPos": {
                          "h": 8,
                          "w": 16,
                          "x": 8,
                          "y": 0
                        },
                        "id": 2,
                        "options": {
                          "legend": {
                            "displayMode": "list",
                            "placement": "bottom",
                            "showLegend": true
                          },
                          "tooltip": {
                            "mode": "single",
                            "sort": "none"
                          }
                        },
                        "targets": [
                          {
                            "datasource": {
                              "type": "prometheus",
                              "uid": "prometheus"
                            },
                            "editorMode": "code",
                            "expr": "kube_pod_container_status_ready{namespace=\"cthutool\",container=\"backend\"}",
                            "legendFormat": "{{pod}} ready",
                            "range": true,
                            "refId": "A"
                          }
                        ],
                        "title": "Backend pod readiness",
                        "type": "timeseries"
                      },
                      {
                        "datasource": {
                          "type": "loki",
                          "uid": "loki"
                        },
                        "gridPos": {
                          "h": 10,
                          "w": 24,
                          "x": 0,
                          "y": 8
                        },
                        "id": 3,
                        "options": {
                          "dedupStrategy": "none",
                          "enableLogDetails": true,
                          "prettifyLogMessage": true,
                          "showCommonLabels": false,
                          "showLabels": false,
                          "showTime": true,
                          "sortOrder": "Descending",
                          "wrapLogMessage": true
                        },
                        "targets": [
                          {
                            "datasource": {
                              "type": "loki",
                              "uid": "loki"
                            },
                            "expr": "{namespace=\"cthutool\",app=\"cthutool\",component=\"backend\"}",
                            "refId": "A"
                          }
                        ],
                        "title": "Backend structured logs",
                        "type": "logs"
                      }
                    ],
                    "refresh": "30s",
                    "schemaVersion": 42,
                    "tags": [
                      "cthutool",
                      "kubernetes",
                      "observability"
                    ],
                    "templating": {
                      "list": []
                    },
                    "time": {
                      "from": "now-1h",
                      "to": "now"
                    },
                    "timezone": "browser",
                    "title": "CthuTool Kubernetes Workloads",
                    "uid": "cthutool-k8s-workloads",
                    "version": 1
                  }

        prometheus:
          service:
            type: ClusterIP
          prometheusSpec:
            retention: 7d
            enableAdminAPI: false
            additionalScrapeConfigs:
              - job_name: cthutool-backend
                kubernetes_sd_configs:
                  - role: endpoints
                    namespaces:
                      names:
                        - cthutool
                relabel_configs:
                  - source_labels:
                      - __meta_kubernetes_service_annotation_prometheus_io_scrape
                    action: keep
                    regex: "true"
                  - source_labels:
                      - __meta_kubernetes_service_annotation_prometheus_io_path
                    target_label: __metrics_path__
                    regex: "(.+)"
                  - source_labels:
                      - __address__
                      - __meta_kubernetes_service_annotation_prometheus_io_port
                    action: replace
                    regex: "([^:]+)(?::\\d+)?;(\\d+)"
                    replacement: "$1:$2"
                    target_label: __address__
                  - source_labels:
                      - __meta_kubernetes_namespace
                    target_label: namespace
                  - source_labels:
                      - __meta_kubernetes_service_label_app_kubernetes_io_part_of
                    target_label: app
                  - source_labels:
                      - __meta_kubernetes_service_label_app_kubernetes_io_component
                    target_label: component
                  - source_labels:
                      - __meta_kubernetes_service_name
                    target_label: service
                  - source_labels:
                      - __meta_kubernetes_pod_name
                    target_label: instance

        prometheusOperator:
          admissionWebhooks:
            enabled: true

        kube-state-metrics:
          metricLabelsAllowlist:
            - pods=[app.kubernetes.io/name,app.kubernetes.io/part-of,app.kubernetes.io/component]
            - services=[app.kubernetes.io/name,app.kubernetes.io/part-of,app.kubernetes.io/component]
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
