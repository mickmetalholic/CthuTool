apiVersion: apps/v1
kind: Deployment
metadata:
  name: cthutool-backend
  namespace: cthutool
  labels:
    app.kubernetes.io/name: cthutool-backend
    app.kubernetes.io/part-of: cthutool
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cthutool-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cthutool-backend
        app.kubernetes.io/part-of: cthutool
        app.kubernetes.io/managed-by: argocd
    spec:
      containers:
        - name: backend
          image: cthutool/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cthutool-backend
          env:
            - name: BROWSER_DATA_DIR
              value: /data/browser
            - name: BROWSER_AUTH_STATE_DIR
              value: /data/secrets/browser-auth
            - name: BROWSER_DIAGNOSTICS_DIR
              value: /data/browser-diagnostics
          volumeMounts:
            - name: browser-data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: browser-data
          emptyDir: {}
