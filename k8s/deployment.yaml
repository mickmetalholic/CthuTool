apiVersion: apps/v1
kind: Deployment
metadata:
  name: cthutool-backend
  namespace: cthutool
  labels:
    app.kubernetes.io/name: cthutool-backend
    app.kubernetes.io/part-of: cthutool
    app.kubernetes.io/component: backend
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cthutool-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cthutool-backend
        app.kubernetes.io/part-of: cthutool
        app.kubernetes.io/component: backend
        app.kubernetes.io/managed-by: argocd
    spec:
      containers:
        - name: backend
          image: ghcr.io/mickmetalholic/cthutool-backend:4a21e09314b1d293d8e13e5c92f644789eb2c43e
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cthutool-backend
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
