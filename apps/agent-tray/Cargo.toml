[package]
name = "cthutool-agent-tray"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native tray supervisor for the CthuTool local Agent"

[dependencies]
ctrlc = { version = "=3.5.2", features = ["termination"] }
interprocess = "=2.4.2"
open = "=5.4.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
single-instance = "=0.3.3"
sysinfo = { version = "=0.39.6", default-features = false, features = ["system", "user"] }
thiserror = "=2.0.19"
url = "=2.5.8"
uuid = { version = "=1.24.0", features = ["v4"] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tray-icon = { version = "=0.24.1", default-features = false }
winit = { version = "=0.30.12", default-features = false }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
