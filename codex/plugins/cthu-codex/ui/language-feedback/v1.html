<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>English feedback</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          var(--font-sans, -apple-system),
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        --surface: var(--color-background-primary, #ffffff);
        --surface-muted: var(--color-background-secondary, #f5f6f6);
        --text: var(--color-text-primary, #25292c);
        --text-muted: var(--color-text-secondary, #60676c);
        --border: var(--color-border-secondary, #dce0e2);
        --rule: #bdc4c8;
        --success: var(--color-text-success, #26704a);
        --danger: var(--color-text-danger, #ad343c);
        --focus: var(--color-ring-info, #526a80);
      }

      :root[data-theme="dark"] {
        --surface: var(--color-background-primary, #202224);
        --surface-muted: var(--color-background-secondary, #2b2e31);
        --text: var(--color-text-primary, #e9ebed);
        --text-muted: var(--color-text-secondary, #a6aeb4);
        --border: var(--color-border-secondary, #3b4044);
        --rule: #626b73;
        --success: var(--color-text-success, #8dc8a5);
        --danger: var(--color-text-danger, #ef9b9b);
        --focus: var(--color-ring-info, #a4bbcd);
      }

      * {
        box-sizing: border-box;
      }

      /* Component layout rules must not override the HTML hidden state. */
      [hidden] {
        display: none !important;
      }

      body {
        margin: 0;
        padding: 2px;
        background: transparent;
        color: var(--text);
        font-size: 14px;
        line-height: 1.6;
      }

      button {
        font: inherit;
      }

      .loading {
        display: flex;
        align-items: center;
        min-height: 72px;
        padding: 16px 20px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
        color: var(--text-muted);
        font-size: 13px;
      }

      .coach-card {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }

      .card-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
      }

      h1,
      h2,
      p {
        margin: 0;
      }

      h1 {
        font-size: 13px;
        font-weight: 600;
        line-height: 1.4;
      }

      .content {
        display: grid;
        gap: 20px;
        padding: 18px 20px 20px;
      }

      .no-suggestions {
        padding: 16px 20px;
        font-size: 13px;
      }

      .section-label {
        color: var(--text-muted);
        font-size: 12px;
        font-weight: 500;
        line-height: 1.4;
      }

      .original-block {
        display: grid;
        gap: 6px;
      }

      .original-text {
        color: var(--text-muted);
        font-size: 13px;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      .best-block {
        display: grid;
        padding-left: 14px;
        border-left: 2px solid var(--rule);
      }

      .suggestion-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 8px;
      }

      .best-text {
        font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
        font-size: 21px;
        font-weight: 400;
        line-height: 1.5;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
        user-select: text;
      }

      .copy-button {
        display: inline-flex;
        flex: 0 0 auto;
        min-height: 30px;
        align-items: center;
        gap: 6px;
        padding: 4px 9px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: transparent;
        color: var(--text-muted);
        cursor: pointer;
        font-size: 12px;
        line-height: 1.5;
      }

      .copy-button:hover {
        background: var(--surface-muted);
        color: var(--text);
      }

      .copy-button:focus-visible {
        outline: 2px solid var(--focus);
        outline-offset: 3px;
      }

      .copy-button svg {
        width: 13px;
        height: 13px;
      }

      .copy-status {
        color: var(--success);
        font-family: inherit;
        font-size: 12px;
      }

      .copy-status:not(:empty) {
        margin-top: 8px;
      }

      .copy-status[data-state="error"] {
        color: var(--danger);
      }

      .notes-block {
        display: grid;
        gap: 12px;
        padding-top: 16px;
        border-top: 1px solid var(--border);
      }

      .note-list {
        display: grid;
        gap: 12px;
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .note-item {
        display: grid;
        grid-template-columns: 80px minmax(0, 1fr);
        align-items: baseline;
        gap: 12px;
      }

      .note-category {
        color: var(--text-muted);
        font-size: 11px;
        line-height: 1.6;
      }

      .note-message {
        font-size: 13px;
        overflow-wrap: anywhere;
        white-space: pre-wrap;
      }

      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --surface: var(--color-background-primary, #202224);
          --surface-muted: var(--color-background-secondary, #2b2e31);
          --text: var(--color-text-primary, #e9ebed);
          --text-muted: var(--color-text-secondary, #a6aeb4);
          --border: var(--color-border-secondary, #3b4044);
          --rule: #626b73;
          --success: var(--color-text-success, #8dc8a5);
          --danger: var(--color-text-danger, #ef9b9b);
          --focus: var(--color-ring-info, #a4bbcd);
        }
      }

      @media (max-width: 420px) {
        .card-header,
        .content,
        .no-suggestions {
          padding-right: 16px;
          padding-left: 16px;
        }

        .best-text {
          font-size: 20px;
        }

        .note-item {
          grid-template-columns: 1fr;
          gap: 2px;
        }
      }
    </style>
  </head>
  <body>
    <div id="loading" class="loading" role="status">
      Loading feedback…
    </div>

    <main id="app" hidden>
      <article class="coach-card" aria-labelledby="coach-title">
        <p id="no-suggestions" class="no-suggestions" hidden>
          Your message is grammatically correct and sounds natural.
        </p>
        <header id="feedback-header" class="card-header">
          <h1 id="coach-title">English feedback</h1>
        </header>

        <div id="feedback-details" class="content">
          <section class="original-block" aria-labelledby="original-label">
            <h2 id="original-label" class="section-label">You wrote</h2>
            <p id="original-text" class="original-text"></p>
          </section>

          <section class="best-block" aria-labelledby="best-label">
            <div class="suggestion-header">
              <h2 id="best-label" class="section-label">Suggested wording</h2>
              <button id="copy-button" class="copy-button" type="button">
                <svg
                  viewBox="0 0 24 24"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.8"
                  aria-hidden="true"
                >
                  <rect x="8" y="8" width="11" height="11" rx="2" />
                  <path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" />
                </svg>
                <span id="copy-label">Copy suggestion</span>
              </button>
            </div>
            <p id="best-text" class="best-text" tabindex="-1"></p>
            <p
              id="copy-status"
              class="copy-status"
              role="status"
              aria-live="polite"
            ></p>
          </section>

          <section
            id="notes-block"
            class="notes-block"
            aria-labelledby="notes-label"
          >
            <h2 id="notes-label" class="section-label">Notes</h2>
            <ol id="note-list" class="note-list"></ol>
          </section>
        </div>
      </article>
    </main>

    <script>
      (() => {
        const MCP_APPS_PROTOCOL_VERSION = "2026-01-26";
        const CATEGORY_LABELS = {
          grammar: "Grammar",
          naturalness: "Phrasing",
          tone: "Tone",
          idiom: "Idioms",
          clarity: "Clarity",
          other: "Usage",
        };
        const pendingRequests = new Map();
        let nextRequestId = 1;
        let currentFeedback;
        let initialized = false;
        let resizeObserver;

        const loading = document.getElementById("loading");
        const app = document.getElementById("app");
        const feedbackHeader = document.getElementById("feedback-header");
        const feedbackDetails = document.getElementById("feedback-details");
        const noSuggestionsText = document.getElementById("no-suggestions");
        const originalText = document.getElementById("original-text");
        const bestLabel = document.getElementById("best-label");
        const bestText = document.getElementById("best-text");
        const notesBlock = document.getElementById("notes-block");
        const noteList = document.getElementById("note-list");
        const copyButton = document.getElementById("copy-button");
        const copyLabel = document.getElementById("copy-label");
        const copyStatus = document.getElementById("copy-status");

        function send(message) {
          if (window.parent === window) return;
          window.parent.postMessage(message, "*");
        }

        function request(method, params) {
          const id = `cthu-language-feedback-${nextRequestId++}`;
          send({ jsonrpc: "2.0", id, method, params });
          return new Promise((resolve, reject) => {
            pendingRequests.set(id, { resolve, reject });
          });
        }

        function notify(method, params = {}) {
          send({ jsonrpc: "2.0", method, params });
        }

        function isFeedback(value) {
          return (
            value &&
            value.version === 1 &&
            (value.variant === undefined || value.variant === "compact") &&
            typeof value.original === "string" &&
            value.original.trim() !== "" &&
            typeof value.bestVersion === "string" &&
            value.bestVersion.trim() !== "" &&
            Array.isArray(value.notes)
          );
        }

        function reportSize() {
          // Measure content independently of the host's viewport height.
          const height = Math.ceil(document.body.getBoundingClientRect().height);
          if (initialized) {
            notify("ui/notifications/size-changed", {
              width: Math.ceil(document.documentElement.scrollWidth),
              height,
            });
          }
          // Compatibility hosts may never answer ui/initialize.
          if (typeof window.openai?.notifyIntrinsicHeight === "function") {
            try {
              window.openai.notifyIntrinsicHeight(height);
            } catch {
              // A failed compatibility notification must not break the card.
            }
          }
        }

        function renderFeedback(feedback) {
          if (!isFeedback(feedback)) return;
          currentFeedback = feedback;
          originalText.textContent = feedback.original;
          bestText.textContent = feedback.bestVersion;
          const unchanged =
            feedback.original.trim() === feedback.bestVersion.trim();
          const noSuggestions = unchanged && feedback.notes.length === 0;
          feedbackHeader.hidden = noSuggestions;
          feedbackDetails.hidden = noSuggestions;
          noSuggestionsText.hidden = !noSuggestions;
          bestLabel.textContent = unchanged
            ? "No changes needed"
            : "Suggested wording";
          copyLabel.textContent = unchanged ? "Copy text" : "Copy suggestion";
          noteList.replaceChildren();

          for (const note of feedback.notes) {
            if (
              !note ||
              typeof note.message !== "string" ||
              !CATEGORY_LABELS[note.category]
            ) {
              continue;
            }

            const item = document.createElement("li");
            item.className = "note-item";
            const category = document.createElement("span");
            category.className = "note-category";
            category.textContent = CATEGORY_LABELS[note.category];
            const message = document.createElement("span");
            message.className = "note-message";
            message.textContent = note.message;
            item.append(category, message);
            noteList.append(item);
          }

          notesBlock.hidden = noteList.children.length === 0;
          copyStatus.textContent = "";
          copyStatus.dataset.state = "";
          loading.hidden = true;
          app.hidden = false;
          requestAnimationFrame(reportSize);
        }

        function applyHostContext(context) {
          if (!context || typeof context !== "object") return;
          if (context.theme === "light" || context.theme === "dark") {
            document.documentElement.dataset.theme = context.theme;
          }
          if (context.styles && typeof context.styles === "object") {
            for (const [name, value] of Object.entries(context.styles)) {
              if (name.startsWith("--") && typeof value === "string") {
                document.documentElement.style.setProperty(name, value);
              }
            }
          }
        }

        function selectBestVersion() {
          bestText.focus();
          const selection = window.getSelection();
          const range = document.createRange();
          range.selectNodeContents(bestText);
          selection?.removeAllRanges();
          selection?.addRange(range);
        }

        function legacyCopy(value) {
          const textarea = document.createElement("textarea");
          textarea.value = value;
          textarea.setAttribute("readonly", "");
          textarea.style.position = "fixed";
          textarea.style.opacity = "0";
          document.body.append(textarea);
          textarea.select();
          const copied =
            typeof document.execCommand === "function" &&
            document.execCommand("copy");
          textarea.remove();
          return copied;
        }

        async function copyBestVersion() {
          if (!currentFeedback) return;
          try {
            if (typeof navigator.clipboard?.writeText === "function") {
              await navigator.clipboard.writeText(currentFeedback.bestVersion);
            } else if (!legacyCopy(currentFeedback.bestVersion)) {
              throw new Error("Clipboard access is unavailable.");
            }
            copyStatus.dataset.state = "success";
            copyStatus.textContent = "Copied to clipboard.";
          } catch {
            selectBestVersion();
            copyStatus.dataset.state = "error";
            copyStatus.textContent =
              "Couldn't copy. Copy the selected text manually.";
          }
          reportSize();
        }

        copyButton.addEventListener("click", copyBestVersion);

        window.addEventListener(
          "message",
          (event) => {
            if (
              window.parent !== window &&
              event.source !== window.parent
            ) {
              return;
            }
            const message = event.data;
            if (!message || message.jsonrpc !== "2.0") return;

            if (
              message.id !== undefined &&
              pendingRequests.has(message.id)
            ) {
              const pending = pendingRequests.get(message.id);
              pendingRequests.delete(message.id);
              if (message.error) pending.reject(message.error);
              else pending.resolve(message.result);
              return;
            }

            if (message.method === "ui/notifications/tool-result") {
              renderFeedback(message.params?.structuredContent);
            } else if (
              message.method === "ui/notifications/host-context-changed"
            ) {
              applyHostContext(message.params);
            } else if (message.method === "ui/resource-teardown") {
              resizeObserver?.disconnect();
              if (message.id !== undefined) {
                send({ jsonrpc: "2.0", id: message.id, result: {} });
              }
            }
          },
          { passive: true },
        );

        window.addEventListener(
          "openai:set_globals",
          (event) => {
            const globals = event.detail?.globals;
            applyHostContext(globals);
            if (isFeedback(globals?.toolOutput)) {
              renderFeedback(globals.toolOutput);
            }
          },
          { passive: true },
        );

        const openai = window.openai;
        applyHostContext({ theme: openai?.theme });
        if (isFeedback(openai?.toolOutput)) {
          renderFeedback(openai.toolOutput);
        }

        if (typeof ResizeObserver === "function") {
          resizeObserver = new ResizeObserver(reportSize);
          resizeObserver.observe(document.body);
        }

        if (window.parent !== window) {
          request("ui/initialize", {
            protocolVersion: MCP_APPS_PROTOCOL_VERSION,
            appInfo: {
              name: "CthuCodex language feedback",
              version: "1.0.0",
            },
            appCapabilities: {},
          })
            .then((result) => {
              applyHostContext(result?.hostContext);
              notify("ui/notifications/initialized");
              initialized = true;
              reportSize();
            })
            .catch(() => {
              if (isFeedback(window.openai?.toolOutput)) {
                renderFeedback(window.openai.toolOutput);
              }
            });
        }
      })();
    </script>
  </body>
</html>
