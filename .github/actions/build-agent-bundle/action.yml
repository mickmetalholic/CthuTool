name: Build CthuTool Agent bundle
description: Assemble, smoke-test, and attest one Agent target for self-use or PR validation

inputs:
  target:
    required: true
  rust-target:
    required: true
  release-version:
    required: true
  provenance:
    required: true
  pull-request-marker:
    required: false
  artifact-base-url:
    required: true

runs:
  using: composite
  steps:
    - name: Set up pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 9.15.4

    - name: Set up build Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "24.14.1"
        cache: pnpm

    - name: Set up Rust target
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        target: ${{ inputs.rust-target }}
        toolchain: "1.96.0"

    - name: Restore Rust target cache
      uses: Swatinem/rust-cache@v2
      with:
        shared-key: agent-release-${{ inputs.target }}
        workspaces: ". -> target"

    - name: Verify native runner architecture
      shell: bash
      run: |
        node -e "const target=process.argv[1]; const expected=target === 'darwin-arm64' ? ['darwin','arm64'] : target === 'darwin-x64' ? ['darwin','x64'] : ['win32','x64']; if (process.platform !== expected[0] || process.arch !== expected[1]) throw new Error('Runner architecture does not match ' + target + ': ' + process.platform + '-' + process.arch);" "${{ inputs.target }}"

    - name: Install locked workspace dependencies
      shell: bash
      run: pnpm install --frozen-lockfile

    - name: Build release tooling, Agent, tray, and native setup
      shell: bash
      run: |
        set -euo pipefail
        pnpm --filter @cthutool/agent-release build
        pnpm --filter @cthutool/agent build
        echo "::notice title=Native setup packaging::Building tray and setup executables for ${{ inputs.target }}"
        cargo build --locked --release --target "${{ inputs.rust-target }}" -p cthutool-agent-tray -p cthutool-agent-setup

    - name: Prepare exact pinned Node.js runtime
      shell: bash
      run: |
        node packages/agent-release/dist/cli.js prepare-node \
          --lock release/agent/node-runtime.lock.json \
          --target "${{ inputs.target }}" \
          --output-dir .release/node

    - name: Create production dependency deployment
      shell: bash
      run: pnpm --filter @cthutool/agent --prod deploy .release/deployed-agent

    - name: Assemble immutable bundle with native setup
      shell: bash
      env:
        RELEASE_PROVENANCE: ${{ inputs.provenance }}
      run: |
        set -euo pipefail
        mkdir -p .release/stage .release/out .release/user-data-fresh .release/user-data-configured
        TRAY_PATH="target/${{ inputs.rust-target }}/release/cthutool-agent-tray"
        SETUP_PATH="target/${{ inputs.rust-target }}/release/cthutool-agent-setup"
        NODE_PATH=".release/node/node"
        PR_ARGUMENTS=()
        if [ "${{ inputs.target }}" = "windows-x64" ]; then
          TRAY_PATH="$TRAY_PATH.exe"
          SETUP_PATH="$SETUP_PATH.exe"
          NODE_PATH=".release/node/node.exe"
        fi
        if [ ! -f "$SETUP_PATH" ]; then
          echo "::error title=Native setup packaging::Missing setup executable at $SETUP_PATH"
          exit 1
        fi
        if [ "$RELEASE_PROVENANCE" = "pull-request-validation" ]; then
          PR_ARGUMENTS=(--pull-request-marker "${{ inputs.pull-request-marker }}")
        fi
        echo "::notice title=Native setup packaging::Assembling archive inventory for ${{ inputs.target }}"
        node packages/agent-release/dist/cli.js assemble \
          --target "${{ inputs.target }}" \
          --version "${{ inputs.release-version }}" \
          --tray "$TRAY_PATH" \
          --setup "$SETUP_PATH" \
          --node "$NODE_PATH" \
          --node-license .release/node/LICENSE \
          --agent-dir .release/deployed-agent \
          --notices release/agent/licenses/THIRD_PARTY_NOTICES.txt \
          --slint-license apps/agent-setup/LICENSE-SLINT.md \
          --stage-dir .release/stage \
          --output-dir .release/out \
          "${PR_ARGUMENTS[@]}"

    - name: Archive staging tree for self-use publication
      if: inputs.provenance == 'self-use'
      shell: bash
      run: |
        node packages/agent-release/dist/cli.js archive-stage \
          --target "${{ inputs.target }}" \
          --version "${{ inputs.release-version }}" \
          --stage-dir .release/stage \
          --output-dir .release/out

    - name: Smoke fresh archive SetupRequired (no crash loop)
      shell: bash
      run: |
        set -euo pipefail
        # Failure prefixes from smoke: NATIVE_SETUP_PACKAGING | AGENT_RUNTIME | BACKEND_CONNECTIVITY
        echo "::notice title=Agent runtime::Verifying fresh archive reaches SetupRequired"
        node packages/agent-release/dist/cli.js smoke \
          --bundle-root .release/stage \
          --native-smoke \
          --user-data-dir .release/user-data-fresh \
          --timeout-ms 30000

    - name: Smoke configured archive Agent readiness
      shell: bash
      run: |
        set -euo pipefail
        # Failure prefixes from smoke: NATIVE_SETUP_PACKAGING | AGENT_RUNTIME | BACKEND_CONNECTIVITY
        echo "::notice title=Agent runtime::Verifying configured archive reaches Agent readiness"
        node packages/agent-release/dist/cli.js smoke \
          --bundle-root .release/stage \
          --native-smoke \
          --user-data-dir .release/user-data-configured \
          --deployment-origin https://app.example.com \
          --timeout-ms 30000

    - name: Create target receipt and checksum
      shell: bash
      env:
        RELEASE_PROVENANCE: ${{ inputs.provenance }}
      run: |
        ARCHIVE_PATH="$(find .release/out -maxdepth 1 -name '*.zip' -print -quit)"
        node packages/agent-release/dist/cli.js receipt \
          --target "${{ inputs.target }}" \
          --version "${{ inputs.release-version }}" \
          --archive "$ARCHIVE_PATH" \
          --bundle-root .release/stage \
          --base-url "${{ inputs.artifact-base-url }}" \
          --provenance "$RELEASE_PROVENANCE" \
          --output ".release/out/receipt-${{ inputs.target }}.json" \
          --clean-host-smoke
        node -e "const fs=require('node:fs'); const crypto=require('node:crypto'); const path=process.argv[1]; const digest=crypto.createHash('sha256').update(fs.readFileSync(path)).digest('hex'); fs.writeFileSync(path + '.sha256', digest + '  ' + require('node:path').basename(path) + '\n');" "$ARCHIVE_PATH"

    - name: Revalidate final inventory
      shell: bash
      run: |
        node packages/agent-release/dist/cli.js validate-inventory \
          --target "${{ inputs.target }}" \
          --bundle-root .release/stage
