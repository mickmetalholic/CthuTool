name: Backend Image

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/mickmetalholic/cthutool-backend

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend image changes
        id: affected
        run: node scripts/ci/affected-workflow.mjs backend-image

      - name: Skip backend image validation
        if: steps.affected.outputs.changed != 'true'
        run: echo "Backend image inputs are unchanged; skipping image validation."

      - name: Set up Docker Buildx
        if: steps.affected.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        if: steps.affected.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          cache-from: type=gha

  build-and-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: backend-image-main
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend image changes
        id: affected
        run: node scripts/ci/affected-workflow.mjs backend-image

      - name: Skip backend image publish
        if: steps.affected.outputs.changed != 'true'
        run: echo "Backend image inputs are unchanged; skipping image publish."

      - name: Set up Docker Buildx
        if: steps.affected.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.affected.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        if: steps.affected.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
