name: Backend Image

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  IMAGE_NAME: ghcr.io/mickmetalholic/cthutool-backend

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend image changes
        id: affected
        run: node scripts/ci/affected-workflow.mjs backend-image

      - name: Skip backend image validation
        if: steps.affected.outputs.changed != 'true'
        run: echo "Backend image inputs are unchanged; skipping image validation."

      - name: Set up Docker Buildx
        if: steps.affected.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        if: steps.affected.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: false
          cache-from: type=gha

  build-and-push:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: backend-image-main
      cancel-in-progress: false
    permissions:
      contents: write
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect backend image changes
        id: affected
        run: node scripts/ci/affected-workflow.mjs backend-image

      - name: Skip backend image publish
        if: steps.affected.outputs.changed != 'true'
        run: echo "Backend image inputs are unchanged; skipping image publish."

      - name: Set up Docker Buildx
        if: steps.affected.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: steps.affected.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        if: steps.affected.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin deployment manifest to commit image
        if: steps.affected.outputs.changed == 'true'
        run: |
          python - <<'PY'
          from pathlib import Path

          deployment = Path("k8s/deployment.yaml")
          text = deployment.read_text()
          old = text
          prefix = "image: ghcr.io/mickmetalholic/cthutool-backend:"
          lines = [
              f"{line[: len(line) - len(line.lstrip())]}{prefix}${{ github.sha }}"
              if line.strip().startswith(prefix)
              else line
              for line in text.splitlines()
          ]
          text = "\n".join(lines) + "\n"
          if text == old:
              raise SystemExit("Deployment image reference was not updated")
          deployment.write_text(text)
          PY

      - name: Commit deployment manifest update
        if: steps.affected.outputs.changed == 'true'
        run: |
          if git diff --quiet -- k8s/deployment.yaml; then
            echo "Deployment manifest already points at ${{ github.sha }}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "chore(gitops): deploy backend image ${{ github.sha }} [skip ci]"
          git push
