name: Backend Image

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/backend-image.yml"
      - "apps/backend/**"
      - "packages/agent-protocol/**"
      - "packages/config/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "k8s/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  IMAGE_NAME: ghcr.io/mickmetalholic/cthutool-backend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:main
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin deployment manifest to commit image
        run: |
          python - <<'PY'
          from pathlib import Path

          deployment = Path("k8s/deployment.yaml")
          text = deployment.read_text()
          old = text
          prefix = "image: ghcr.io/mickmetalholic/cthutool-backend:"
          lines = [
              f"{line[: len(line) - len(line.lstrip())]}{prefix}${{ github.sha }}"
              if line.strip().startswith(prefix)
              else line
              for line in text.splitlines()
          ]
          text = "\n".join(lines) + "\n"
          if text == old:
              raise SystemExit("Deployment image reference was not updated")
          deployment.write_text(text)
          PY

      - name: Commit deployment manifest update
        run: |
          if git diff --quiet -- k8s/deployment.yaml; then
            echo "Deployment manifest already points at ${{ github.sha }}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "chore(gitops): deploy backend image ${{ github.sha }} [skip ci]"
          git push
