name: CLI Distribution

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep the repository mirror for local development, but use npmjs on GitHub-hosted runners.
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cli-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect CLI distribution changes
        id: affected
        run: node scripts/ci/affected-workflow.mjs cli-dist

      - name: Skip CLI distribution check
        if: steps.affected.outputs.changed != 'true'
        run: echo "CLI distribution inputs are unchanged; skipping bundle check."

      - uses: pnpm/action-setup@v4
        if: steps.affected.outputs.changed == 'true'
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        if: steps.affected.outputs.changed == 'true'
        with:
          node-version: "24.14.1"
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        if: steps.affected.outputs.changed == 'true'
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        if: steps.affected.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      - name: Check CLI distribution bundle
        if: steps.affected.outputs.changed == 'true'
        run: pnpm run check:cli-dist

      - name: Prepare a verified temporary chezmoi renderer
        if: steps.affected.outputs.changed == 'true'
        shell: bash
        run: |
          renderer="$RUNNER_TEMP/cthu-chezmoi"
          mkdir -p "$renderer"
          curl --fail --location --max-time 120 https://github.com/twpayne/chezmoi/releases/download/v2.73.3/chezmoi_2.73.3_linux_amd64.tar.gz -o "$renderer/chezmoi.tar.gz"
          printf '%s  %s\n' '6e5827598cbfc02d132b04f95b5ea10efb5b79230e2a4a0e52df4af144a8ee9f' "$renderer/chezmoi.tar.gz" | sha256sum --check
          tar -xzf "$renderer/chezmoi.tar.gz" -C "$renderer" chezmoi
          printf 'CHC_TEST_CHEZMOI=%s/chezmoi\n' "$renderer" >> "$GITHUB_ENV"

      - name: Test dotfiles behavior without installation side effects
        if: steps.affected.outputs.changed == 'true'
        run: pnpm --filter @cthutool/cli exec bun test --timeout 120000 tests/unit/dotfiles.test.ts tests/unit/dotfiles-bootstrap.test.ts tests/integration/dotfiles-command.test.ts
