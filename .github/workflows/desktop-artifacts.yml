name: Desktop Artifacts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/desktop-artifacts.yml"
      - "apps/desktop/**"
      - "packages/agent-protocol/**"
      - "packages/app-shell/**"
      - "packages/ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "turbo.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/desktop-artifacts.yml"
      - "apps/desktop/**"
      - "packages/agent-protocol/**"
      - "packages/app-shell/**"
      - "packages/ui/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "turbo.json"

permissions:
  contents: read

jobs:
  package:
    name: Package desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: pnpm

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate desktop dependency graph
        run: pnpm turbo run typecheck test build --filter=@cthutool/desktop...

      - name: Package Windows desktop
        if: matrix.os == 'windows-latest'
        run: pnpm --filter @cthutool/desktop package:win:from-build

      - name: Package macOS desktop
        if: matrix.os == 'macos-latest'
        run: pnpm --filter @cthutool/desktop package:mac:from-build

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: cthudesktop-${{ runner.os }}
          path: apps/desktop/release/**
          if-no-files-found: error
