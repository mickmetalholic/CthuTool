name: Agent Release

on:
  # This workflow must start for every PR because `aggregate-pr` is required by
  # the main ruleset. The lightweight scope job below gates the native matrix.
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/actions/build-agent-bundle/**"
      - ".github/workflows/agent-release.yml"
      - "apps/agent/**"
      - "apps/agent-setup/**"
      - "apps/agent-tray/**"
      - "apps/cli/**"
      - "packages/agent-bridge-protocol/**"
      - "packages/agent-protocol/**"
      - "packages/agent-release/**"
      - "packages/agent-runtime/**"
      - "packages/browser-runtime-protocol/**"
      - "release/agent/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.json"
      - "turbo.json"
  workflow_dispatch:

permissions:
  contents: read

env:
  # Keep the repository mirror for local development, but use npmjs on GitHub-hosted runners.
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

concurrency:
  group: agent-self-use-${{ github.event.pull_request.number || 'latest' }}
  cancel-in-progress: true

jobs:
  pr_scope:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      agent_changed: ${{ steps.changes.outputs.agent_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: changes
        name: Detect Agent release inputs
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed_paths_file="$RUNNER_TEMP/agent-release-changed-paths.txt"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$changed_paths_file"
          CHANGED_PATHS_FILE="$changed_paths_file" node <<'NODE'
          const fs = require('node:fs');

          const changedPaths = fs
            .readFileSync(process.env.CHANGED_PATHS_FILE, 'utf8')
            .split('\n')
            .filter(Boolean);
          const prefixes = [
            '.github/actions/build-agent-bundle/',
            'apps/agent/',
            'apps/agent-setup/',
            'apps/agent-tray/',
            'apps/cli/',
            'packages/agent-bridge-protocol/',
            'packages/agent-protocol/',
            'packages/agent-release/',
            'packages/agent-runtime/',
            'packages/browser-runtime-protocol/',
            'release/agent/',
          ];
          const exactPaths = new Set([
            '.github/workflows/agent-release.yml',
            'Cargo.lock',
            'Cargo.toml',
            'rust-toolchain.toml',
            'package.json',
            'pnpm-lock.yaml',
            'pnpm-workspace.yaml',
            'tsconfig.json',
            'turbo.json',
          ]);
          const agentChanged = changedPaths.some(
            (path) =>
              exactPaths.has(path) || prefixes.some((prefix) => path.startsWith(prefix)),
          );

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `agent_changed=${agentChanged ? 'true' : 'false'}\n`,
          );
          NODE

  matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: targets
        name: Load supported release matrix
        shell: bash
        run: |
          node -e "const fs=require('node:fs'); const value=JSON.parse(fs.readFileSync('release/agent/supported-targets.json')); if (value.schemaVersion !== 1 || value.targets.length !== 3) throw new Error('Supported target matrix is invalid'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'matrix=' + JSON.stringify({include:value.targets}) + '\n');"

  release-context:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      base-url: ${{ steps.release.outputs.base-url }}
    steps:
      - id: release
        name: Generate self-use release identity
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node -e "const fs=require('node:fs'); const version='0.0.' + process.env.RUN_NUMBER; if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Generated Agent release version must be semver'); fs.appendFileSync(process.env.GITHUB_OUTPUT, 'version=' + version + '\nbase-url=https://github.com/' + process.env.REPOSITORY + '/releases/download/agent-latest/\n');"

  build-pr:
    if: >-
      github.event_name == 'pull_request' &&
      needs.pr_scope.outputs.agent_changed == 'true'
    needs:
      - matrix
      - pr_scope
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-agent-bundle
        with:
          target: ${{ matrix.target }}
          rust-target: ${{ matrix.rustTarget }}
          # run_id is stable across partial reruns, so receipts from different
          # attempts retain one validation identity.
          release-version: 0.0.0-pr.${{ github.event.pull_request.number }}.run${{ github.run_id }}
          provenance: pull-request-validation
          pull-request-marker: ${{ github.event.pull_request.number }}-${{ github.run_id }}
          artifact-base-url: https://pr-validation.invalid/${{ github.run_id }}/0.0.0-pr.${{ github.event.pull_request.number }}.run${{ github.run_id }}/
      - name: Upload marked validation artifact
        uses: actions/upload-artifact@v4
        with:
          name: agent-pr-${{ matrix.target }}
          path: |
            .release/out/*.zip
            .release/out/*.sha256
            .release/out/receipt-*.json
          if-no-files-found: error
          retention-days: 7

  aggregate-pr:
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - build-pr
      - pr_scope
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Validate Agent PR prerequisites
        shell: bash
        env:
          AGENT_CHANGED: ${{ needs.pr_scope.outputs.agent_changed }}
          BUILD_RESULT: ${{ needs['build-pr'].result }}
          SCOPE_RESULT: ${{ needs.pr_scope.result }}
        run: |
          set -euo pipefail
          if [[ "$SCOPE_RESULT" != "success" ]]; then
            echo "Agent path detection did not succeed: $SCOPE_RESULT" >&2
            exit 1
          fi
          case "$AGENT_CHANGED" in
            true)
              if [[ "$BUILD_RESULT" != "success" ]]; then
                echo "Agent PR matrix did not succeed: $BUILD_RESULT" >&2
                exit 1
              fi
              ;;
            false)
              echo "No Agent release inputs changed; aggregate-pr is satisfied."
              ;;
            *)
              echo "Agent path detection returned an invalid value: $AGENT_CHANGED" >&2
              exit 1
              ;;
          esac
      - uses: actions/checkout@v4
        if: ${{ success() && needs.pr_scope.outputs.agent_changed == 'true' }}
      - uses: pnpm/action-setup@v4
        if: ${{ success() && needs.pr_scope.outputs.agent_changed == 'true' }}
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        if: ${{ success() && needs.pr_scope.outputs.agent_changed == 'true' }}
        with:
          node-version: "24.14.1"
          cache: pnpm
      - if: ${{ success() && needs.pr_scope.outputs.agent_changed == 'true' }}
        run: pnpm install --frozen-lockfile
      - if: ${{ success() && needs.pr_scope.outputs.agent_changed == 'true' }}
        run: pnpm --filter @cthutool/agent-release build
      - uses: actions/download-artifact@v4
        if: ${{ success() && needs.pr_scope.outputs.agent_changed == 'true' }}
        with:
          pattern: agent-pr-*
          path: .release/downloads
          merge-multiple: true
      - name: Validate aggregate PR manifest
        if: ${{ success() && needs.pr_scope.outputs.agent_changed == 'true' }}
        shell: bash
        run: |
          mkdir -p .release/downloads
          RECEIPTS="$(find .release/downloads -name 'receipt-*.json' -print | sort | paste -sd, -)"
          node packages/agent-release/dist/cli.js manifest \
            --version "0.0.0-pr.${{ github.event.pull_request.number }}.run${{ github.run_id }}" \
            --minimum-cli-version 0.0.0 \
            --receipts "$RECEIPTS" \
            --provenance pull-request-validation \
            --output .release/downloads/manifest-unsigned-pr.json
          node packages/agent-release/dist/cli.js validate-manifest \
            --input .release/downloads/manifest-unsigned-pr.json
          if grep -q agent-latest .release/downloads/manifest-unsigned-pr.json; then
            echo "Pull-request manifests must not reference agent-latest" >&2
            exit 1
          fi
          if grep -E 'environmentCatalog|environments\.json' .release/downloads/manifest-unsigned-pr.json; then
            echo "Pull-request manifests must not bind a deployment URL catalog" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ success() && needs.pr_scope.outputs.agent_changed == 'true' }}
        with:
          name: agent-pr-aggregate
          path: .release/downloads/manifest-unsigned-pr.json
          retention-days: 7

  build-self-use:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs:
      - matrix
      - release-context
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-agent-bundle
        with:
          target: ${{ matrix.target }}
          rust-target: ${{ matrix.rustTarget }}
          release-version: ${{ needs.release-context.outputs.version }}
          provenance: self-use
          artifact-base-url: ${{ needs.release-context.outputs.base-url }}
      - name: Upload verified self-use candidate
        uses: actions/upload-artifact@v4
        with:
          name: agent-self-use-${{ matrix.target }}
          path: |
            .release/out/*.zip
            .release/out/*.sha256
            .release/out/receipt-*.json
          if-no-files-found: error
          retention-days: 14

  publish-self-use:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    needs:
      - build-self-use
      - release-context
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @cthutool/agent-release build
      - uses: actions/download-artifact@v4
        with:
          pattern: agent-self-use-*
          path: .release/downloads
          merge-multiple: true
      - name: Prepare publication directory
        shell: bash
        run: mkdir -p .release/publication
      - name: Aggregate and verify complete self-use set
        shell: bash
        run: |
          set -euo pipefail
          RECEIPTS="$(find .release/downloads -name 'receipt-*.json' -print | sort | paste -sd, -)"
          echo "::notice title=Native setup packaging::Aggregating self-use manifest without deployment catalog"
          node packages/agent-release/dist/cli.js manifest \
            --version "${{ needs.release-context.outputs.version }}" \
            --minimum-cli-version 0.0.0 \
            --receipts "$RECEIPTS" \
            --provenance self-use \
            --output .release/publication/manifest.json
          node packages/agent-release/dist/cli.js verify-self-use-set \
            --manifest .release/publication/manifest.json \
            --archives-dir .release/downloads
          node packages/agent-release/dist/cli.js validate-manifest \
            --input .release/publication/manifest.json \
            --self-use
          if grep -E 'environmentCatalog|environments\.json' .release/publication/manifest.json; then
            echo "::error title=Native setup packaging::Self-use manifest must not bind a deployment URL catalog"
            exit 1
          fi
      - name: Publish versioned assets then latest manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release-context.outputs.version }}
        run: |
          RELEASE_TAG="agent-latest"
          NOTES="Unsigned self-use Agent release ${VERSION}. Includes native tray and setup UI. Protects transport and accidental corruption only; not an authenticated public distribution channel. The deployment Origin is configured locally after install; Agent access relies on the deployment's private-network boundary."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --title "CthuTool Agent latest" --notes "$NOTES"
          else
            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "CthuTool Agent latest" \
              --notes "$NOTES"
          fi
          # Upload versioned archives, checksums, and receipts before the manifest.
          gh release upload "$RELEASE_TAG" \
            .release/downloads/*.zip \
            .release/downloads/*.sha256 \
            .release/downloads/receipt-*.json \
            --clobber
          gh release upload "$RELEASE_TAG" \
            .release/publication/manifest.json \
            --clobber
          node -e "const fs=require('node:fs'); const manifest=JSON.parse(fs.readFileSync('.release/publication/manifest.json','utf8')); if (manifest.provenance.kind !== 'self-use' || manifest.provenance.signed !== false) throw new Error('Published manifest must be unsigned self-use'); if (manifest.environmentCatalog) throw new Error('Published manifest must not bind a deployment catalog'); if (manifest.artifacts.length !== 3) throw new Error('Published manifest must reference the full target set'); for (const artifact of manifest.artifacts) { if (!artifact.setupEntryPoint) throw new Error('Manifest artifact is missing setupEntryPoint'); if (!artifact.archiveUrl.includes('/agent-latest/')) throw new Error('Manifest archive is outside agent-latest'); if (!artifact.archiveUrl.includes(manifest.releaseVersion)) throw new Error('Manifest archive version does not match release'); }"
