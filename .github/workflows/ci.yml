name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

env:
  # Keep the repository mirror for local development, but use npmjs on GitHub-hosted runners.
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commitlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Commitlint (pull_request range)
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to HEAD --verbose

      - name: Commitlint (push last commit)
        if: github.event_name == 'push'
        run: pnpm exec commitlint --last --verbose

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: pnpm

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Tests
        run: pnpm run test
        env:
          SKIP_ROOT_WORKSPACE_CHECK: "true"

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      issues: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.1"
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.ref_name }}-
            turbo-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate repository coverage
        run: pnpm run test:cov
        env:
          SKIP_ROOT_WORKSPACE_CHECK: "true"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: repository-coverage-report
          path: |
            coverage/**
            apps/*/coverage/**
            packages/*/coverage/**
          if-no-files-found: error

      - name: Comment coverage summary on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const expectedSummaries = [
              ['Root tests', 'coverage/coverage-summary.json'],
              ['apps/backend', 'apps/backend/coverage/coverage-summary.json'],
              ['apps/desktop', 'apps/desktop/coverage/coverage-summary.json'],
              ['apps/docs', 'apps/docs/coverage/coverage-summary.json'],
              ['apps/web', 'apps/web/coverage/coverage-summary.json'],
              ['packages/agent-protocol', 'packages/agent-protocol/coverage/coverage-summary.json'],
              ['packages/app-shell', 'packages/app-shell/coverage/coverage-summary.json'],
              ['packages/browser-runtime-protocol', 'packages/browser-runtime-protocol/coverage/coverage-summary.json'],
              ['packages/config', 'packages/config/coverage/coverage-summary.json'],
              ['packages/obsidian-enhancer', 'packages/obsidian-enhancer/coverage/coverage-summary.json'],
              ['packages/ui', 'packages/ui/coverage/coverage-summary.json'],
            ];
            const missingSummaries = expectedSummaries.filter(
              ([, summaryPath]) => !fs.existsSync(summaryPath),
            );
            const summaries = expectedSummaries.filter(([, summaryPath]) =>
              fs.existsSync(summaryPath),
            );
            const metric = (value) =>
              value?.pct === 'Unknown'
                ? `Unknown (${value.covered}/${value.total})`
                : `${value.pct}% (${value.covered}/${value.total})`;
            const body = [
              '## Repository Coverage',
              '',
              ...(missingSummaries.length > 0
                ? [
                    '### Missing expected coverage summaries',
                    ...missingSummaries.map(
                      ([label, summaryPath]) => `- ${label}: ${summaryPath}`,
                    ),
                    '',
                  ]
                : []),
              ...summaries.flatMap(([label, summaryPath]) => {
                const total = JSON.parse(fs.readFileSync(summaryPath, 'utf8')).total;
                return [
                  `### ${label}`,
                  `- Lines: ${metric(total.lines)}`,
                  `- Statements: ${metric(total.statements)}`,
                  `- Functions: ${metric(total.functions)}`,
                  `- Branches: ${metric(total.branches)}`,
                  '',
                ];
              }),
            ].join('\n');

            const marker = '<!-- repository-coverage-comment -->';
            const fullBody = `${marker}\n${body}`;

            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });

              const existing = comments.find((comment) => comment.body?.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body: fullBody,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body: fullBody,
                });
              }
            } catch (error) {
              if (error.status === 403) {
                core.warning(`Skipping coverage PR comment: ${error.message}`);
              } else {
                throw error;
              }
            }

            if (missingSummaries.length > 0) {
              core.setFailed(
                `Missing expected coverage summaries: ${missingSummaries
                  .map(([label, summaryPath]) => `${label} (${summaryPath})`)
                  .join(', ')}`,
              );
            }

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info,apps/*/coverage/lcov.info,packages/*/coverage/lcov.info
          flags: root-workspace
          fail_ci_if_error: false
          use_oidc: true
