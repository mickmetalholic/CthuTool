name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Commitlint (pull_request range)
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to HEAD --verbose

      - name: Commitlint (push last commit)
        if: github.event_name == 'push'
        run: pnpm exec commitlint --last --verbose

      - name: Check
        run: pnpm run check

      - name: Tests
        run: pnpm run test
        env:
          SKIP_ROOT_WORKSPACE_CHECK: "true"

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate repository coverage
        run: pnpm run test:cov
        env:
          SKIP_ROOT_WORKSPACE_CHECK: "true"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: repository-coverage-report
          path: |
            coverage/lcov.info
            coverage/coverage-summary.json
            coverage/lcov-report
            apps/web/coverage/lcov.info
            apps/web/coverage/coverage-summary.json
            apps/web/coverage/lcov-report
          if-no-files-found: error

      - name: Comment coverage summary on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const rootSummaryPath = 'coverage/coverage-summary.json';
            const webSummaryPath = 'apps/web/coverage/coverage-summary.json';
            const rootTotal = JSON.parse(fs.readFileSync(rootSummaryPath, 'utf8')).total;
            const webTotal = JSON.parse(fs.readFileSync(webSummaryPath, 'utf8')).total;
            const metric = (value) =>
              value?.pct === 'Unknown'
                ? `Unknown (${value.covered}/${value.total})`
                : `${value.pct}% (${value.covered}/${value.total})`;
            const body = [
              '## Repository Coverage',
              '',
              '### Root tests',
              '- Note: root suite is contract/integration checks and may be non-instrumented.',
              `- Lines: ${metric(rootTotal.lines)}`,
              `- Statements: ${metric(rootTotal.statements)}`,
              `- Functions: ${metric(rootTotal.functions)}`,
              `- Branches: ${metric(rootTotal.branches)}`,
              '',
              '### apps/web',
              `- Lines: ${metric(webTotal.lines)}`,
              `- Statements: ${metric(webTotal.statements)}`,
              `- Functions: ${metric(webTotal.functions)}`,
              `- Branches: ${metric(webTotal.branches)}`,
            ].join('\n');

            const marker = '<!-- repository-coverage-comment -->';
            const fullBody = `${marker}\n${body}`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find((comment) => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: fullBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: fullBody,
              });
            }

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info,apps/web/coverage/lcov.info
          flags: root,web
          fail_ci_if_error: false
          use_oidc: true
