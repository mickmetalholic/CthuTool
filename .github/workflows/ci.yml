name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Commitlint (pull_request range)
        if: github.event_name == 'pull_request'
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to HEAD --verbose

      - name: Commitlint (push last commit)
        if: github.event_name == 'push'
        run: pnpm exec commitlint --last --verbose

      - name: Check
        run: pnpm run check

      - name: Tests
        run: pnpm run test
        env:
          SKIP_ROOT_WORKSPACE_CHECK: "true"
